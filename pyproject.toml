[build-system]
requires = ["setuptools>=68.0,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "kai"
version = "2.0.0"
description = "Telegram gateway to AI coding-agent backends"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[ext]>=20.0,<23",
    "aiosqlite>=0.19.0,<1",
    "python-dotenv>=1.0.0,<2",
    "aiohttp>=3.9.0,<4",
    "pyyaml>=6.0,<7",
]

[project.scripts]
kai = "kai.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0,<1",
    "pyright>=1.1.390,<2",
    "pip-audit>=2.10.0,<3",
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24.0,<2",
]
memory = [
    "mem0ai>=2.0.0,<3",
    "sentence-transformers>=3.0.0,<6",
]
tts = [
    "piper-tts>=1.4.0,<2",
]
totp = [
    "pyotp>=2.9,<3",
    "qrcode>=7.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kai.workshop" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF005", # list concatenation vs unpacking (preference)
    "RUF012", # mutable class default (false positives with dataclasses)
    "SIM105", # contextlib.suppress vs try/except/pass (less readable for async)
    "SIM108", # ternary vs if/else (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["kai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring optional dependencies (deselect with -m 'not integration')",
    "routing_test: codex routing-policy tests that opt out of the test-level same-user bypass",
]
# Promote the recurring unawaited-AsyncMock leak to an error across the
# entire suite. Python can surface that leak through coroutine finalization,
# so the accompanying unraisable-exception category must also fail. These
# rules hide nothing; known third-party warnings remain suppressed only with
# narrowly scoped `@pytest.mark.filterwarnings` markers at their call sites.
filterwarnings = [
    "error:coroutine '.*AsyncMockMixin[.]_execute_mock_call' was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
include = [
    "src/kai/backend_registry.py",
    "src/kai/github_api.py",
    "src/kai/internal_api_auth.py",
    "src/kai/locks.py",
    "src/kai/prompt_utils.py",
    "src/kai/services.py",
    "src/kai/sessions.py",
    "src/kai/user_isolation.py",
    "src/kai/workshop",
    "src/kai/workspace_utils.py",
]
