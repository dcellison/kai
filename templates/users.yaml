# Per-user configuration for Kai. users.yaml is mandatory; the
# daemon fails closed at startup if it cannot find or parse it.
#
# Canonical paths:
#   protected installs (`sudo make install`): /etc/kai/users.yaml
#   single-user installs (`make config` then `make run`):
#       ${XDG_CONFIG_HOME:-$HOME/.config}/kai/users.yaml
#
# `make config` writes the correct location for the deployment mode
# you select. KAI_USERS_YAML can override either for tests/dev.
#
# Required fields per user: telegram_id, name.
# All other fields are optional. Omitted fields inherit installation
# defaults from .env / /etc/kai/env (model, timeout, workspace_base)
# or the hardcoded defaults documented in the templates/.env header.

users:
  # Example: admin user with full settings
  - telegram_id: 123456789
    name: alice
    role: admin              # "admin" or "user" (default: "user")
    github: alice             # GitHub username for webhook routing
    # os_user: alice          # OS user for subprocess isolation
    # home_workspace: ~/projects/main  # per-user home workspace

    # workspace_base: directory for /workspace new and name resolution.
    # /workspace <name> looks for subdirectories under this path.
    # Inherits the global WORKSPACE_BASE installation default if unset.
    # workspace_base: ~/projects

    # Optional per-user defaults. Users can override these at runtime
    # via /settings. Omitted fields inherit installation defaults
    # (DEFAULT_MODEL, AGENT_TIMEOUT_SECONDS).
    # model: opus             # haiku/sonnet/opus for claude; provider/model for opencode
    # timeout: 300            # response timeout in seconds (max 600)

    # Agent backend. Overrides the global AGENT_BACKEND from .env for
    # this user only. Default is "claude" (Claude Code CLI). Other
    # options: "goose" (Goose ACP, requires llm_provider + API key),
    # "codex" (OpenAI Codex CLI), "opencode" (OpenCode ACP; model is
    # a full "provider/model" ID, auth managed by `opencode auth login`).
    # agent_backend: goose
    # llm_provider: openai    # required for goose; ignored for opencode
    # model: anthropic/claude-sonnet-4-6   # opencode example (full provider/model ID)

    # GitHub notification settings. github_repos controls which repos
    # route events to this user. pr_review and issue_triage toggle
    # automated processing. github_notify_chat_id sends notifications
    # to a separate chat (e.g., a Telegram group) instead of the DM.
    # All are optional and overridable via /github commands.
    # github_repos:
    #   - alice/my-project
    #   - alice/other-repo
    # github_notify_chat_id: -100123456789
    # pr_review: true
    # issue_triage: true

  # Example: regular user with minimal config
  # - telegram_id: 987654321
  #   name: bob
