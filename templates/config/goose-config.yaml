# Goose extension configuration for Kai.
#
# Deployed to ~/.config/goose/config.yaml by `make install` when
# DEFAULT_BACKEND=goose. Controls which Goose extensions are loaded
# in ACP mode (`goose acp`).
#
# GOOSE_MODEL and GOOSE_PROVIDER are intentionally omitted here;
# both are set at runtime by GooseBackend when launching `goose acp`,
# translated from the effective per-user model and llm_provider.
# Workspace config (workspaces.yaml env / env_file) can override
# either one for per-workspace provider or model pinning.

extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []
  todo:
    enabled: false
    type: platform
    name: todo
    bundled: true
    available_tools: []
  # All other extensions: disabled by default. Add entries here
  # if you need additional Goose extensions in ACP mode.
