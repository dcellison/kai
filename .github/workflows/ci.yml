# Lint and test on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workshop-client/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --constraint requirements/constraints.txt -e '.[dev,totp]'

      - name: Install Workshop client dependencies
        run: npm ci --prefix workshop-client

      - name: Check Workshop client
        run: make client-check

      - name: Validate install constraints
        run: make BIN= check-install-constraints

      - name: Lint and format check
        run: make BIN= check

      - name: Type check
        run: make BIN= typecheck

      - name: Run tests
        run: make BIN= test
